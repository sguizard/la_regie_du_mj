name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            plat: windows
          - os: macos-latest
            plat: macos-apple-silicon
          - os: ubuntu-22.04
            plat: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build the standalone server
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pyinstaller --onefile --name serve --console serve.py

      - name: Assemble the package
        shell: bash
        env:
          PLAT: ${{ matrix.plat }}
        run: |
          python - <<'PY'
          import os, shutil
          tag = os.environ['GITHUB_REF_NAME']
          plat = os.environ['PLAT']
          exe = 'serve.exe' if plat == 'windows' else 'serve'
          pkg = 'la-regie-du-mj'
          os.makedirs(pkg, exist_ok=True)
          for f in ['index.html', 'style.css', 'LICENSE', 'CHANGELOG.md',
                    'README.md', 'README.en.md', 'README.es.md',
                    'serve.sh', 'serve.bat', 'serve.py']:
              shutil.copy(f, pkg)
          shutil.copytree('js', os.path.join(pkg, 'js'), dirs_exist_ok=True)
          shutil.copy(os.path.join('dist', exe), pkg)
          if plat != 'windows':
              os.chmod(os.path.join(pkg, exe), 0o755)
          name = f'la-regie-du-mj-{tag}-{plat}'
          shutil.make_archive(name, 'zip', '.', pkg)
          print('made', name + '.zip')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.plat }}
          path: la-regie-du-mj-*.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          awk -v tag="## [$version]" '
            index($0, tag) == 1        { flag = 1; next }
            /^## \[/ || /^\[[^]]+\]: / { flag = 0 }
            flag
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || printf "La Régie du MJ %s\n" "$GITHUB_REF_NAME" > notes.md
          {
            echo ""
            echo "---"
            echo ""
            echo "### Téléchargements"
            echo "- **Windows** — \`…-windows.zip\`, décompresse, double-clique \`serve.exe\`."
            echo "- **macOS (Apple Silicon)** — \`…-macos-apple-silicon.zip\`, puis dans le dossier : \`xattr -dr com.apple.quarantine .\` et \`./serve\`."
            echo "- **Linux** — \`…-linux.zip\`, puis \`./serve\`."
            echo "- **Autre (Mac Intel, autre distro…)** — code source ci-dessous + \`./serve.sh\` (Python 3 ou Node.js)."
            echo ""
            echo "Les exécutables ne sont pas signés (SmartScreen / Gatekeeper préviendront : ouvrir quand même)."
          } >> notes.md
          ls -la la-regie-du-mj-*.zip
          cat notes.md
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" la-regie-du-mj-*.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "La Régie du MJ $GITHUB_REF_NAME" \
              --notes-file notes.md \
              la-regie-du-mj-*.zip
          fi
